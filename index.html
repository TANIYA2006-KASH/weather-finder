<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Search any city for live weather and a 5-day forecast. No API key needed.">
<title>Weather Finder</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-mood="clear">
<main class="wrap">
  <h1>Weather Finder</h1>
  <form id="form" role="search">
    <input id="q" type="search" placeholder="Search a city, e.g. Agra" aria-label="City" autocomplete="off" required>
    <button type="submit">Search</button>
    <button type="button" id="geo" class="alt" aria-label="Use my location">&#9678; Locate</button>
  </form>
  <div id="recent" class="recent" aria-label="Recent searches"></div>
  <div class="unit" role="group" aria-label="Units"><button id="c" class="on">&deg;C</button><button id="f">&deg;F</button></div>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="now" class="card" hidden>
    <div class="top"><div><h2 id="place"></h2><p id="cond"></p></div><div class="icon" id="icon"></div></div>
    <div class="temp" id="temp"></div>
    <dl class="stats">
      <div><dt>Feels like</dt><dd id="feel"></dd></div>
      <div><dt>Humidity</dt><dd id="hum"></dd></div>
      <div><dt>Wind</dt><dd id="wind"></dd></div>
    </dl>
  </section>
  <section id="days" class="days" hidden aria-label="5 day forecast"></section>
  <p class="credit">Data by <a href="https://open-meteo.com/">Open-Meteo</a></p>
</main>
<script src="script.js"></script>
</body>
</html>
